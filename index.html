<style>
  :root{
    --ink:#0b0b0d; --ivory:#eae5da; --ivory-dim:rgba(234,229,218,.62);
    --ivory-faint:rgba(234,229,218,.38); --gold:#d8b24c; --gold-bright:#ecc85f;
    /* one shared clock: the light descends the rule, then sweeps the text */
    /* the controls sit on moving video, so they carry their own ground */
    --panel:rgba(11,11,13,.55);
    --cycle:5.2s;
    --start:1.6s;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 90% at 50% 10%, #14141a 0%, var(--ink) 70%);
    color:var(--ivory);
    font-family:"Jost",sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:2rem;
    -webkit-font-smoothing:antialiased;
    position:relative;overflow-x:hidden;overflow-y:auto;
  }

  /* ---- cinematic background: one of nine clips, graded dark + saturated ---- */
  .bg{position:fixed;inset:0;z-index:-3;overflow:hidden;background:var(--ink)}
  .bg video{
    position:absolute;top:50%;left:50%;
    min-width:100%;min-height:100%;width:auto;height:auto;
    transform:translate(-50%,-50%) scale(1.02);
    object-fit:cover;
    opacity:0;transition:opacity 1.7s ease;
    animation:drift 46s ease-in-out infinite alternate;
  }
  .bg video.on{opacity:1}
  @keyframes drift{
    from{transform:translate(-50%,-50%) scale(1.02)}
    to{transform:translate(-50%,-50%) scale(1.09)}
  }
  /* grade layers: darken + cool so the gold owns the frame */
  .scrim{position:fixed;inset:0;z-index:-2;
    background:
      radial-gradient(62% 48% at 50% 48%, rgba(11,11,13,.42) 0%, rgba(11,11,13,.22) 58%, transparent 100%),
      linear-gradient(to bottom, rgba(11,11,13,.62), rgba(11,11,13,.5) 45%, rgba(11,11,13,.72));}
  .vig{position:fixed;inset:0;z-index:-1;
    background:radial-gradient(115% 90% at 50% 42%, transparent 42%, rgba(5,5,7,.78) 100%);}

  @media (prefers-reduced-motion: reduce){
    .bg{display:none}
  }

  /* hairline rule — light descends during the first quarter of the cycle */
  .rule{
    width:1px;height:64px;position:relative;overflow:hidden;
    background:linear-gradient(to bottom, transparent, rgba(216,178,76,.45));
    opacity:0;animation:fadein 1.6s ease .2s forwards;
  }
  .rule::after{
    content:"";position:absolute;left:0;width:100%;height:42%;top:-45%;
    background:linear-gradient(to bottom, transparent, var(--gold-bright));
    animation:descend var(--cycle) linear var(--start) infinite;
  }
  /* 0–25% of the cycle: travel down; then hold out of view */
  @keyframes descend{
    0%{top:-45%;opacity:1}
    34%{top:105%;opacity:1}
    35%,100%{top:105%;opacity:0}
  }

  .brand{
    margin-top:2.4rem;
    display:block;line-height:0;
    opacity:0;animation:risein 1.8s cubic-bezier(.22,1,.36,1) .5s forwards;
  }
  .brand svg{
    display:block;margin:0 auto;
    width:clamp(17rem, 62vw, 32rem);height:auto;
  }

  /* The travelling light now lives only on the hairline (.rule::after / @keyframes descend).
       The descriptor is a plain static line. The previous 22-character line carried .5em
       tracking; at 66 characters that has to come in, and sit inside a measure, so the
       wrap is a chosen one rather than wherever the viewport happens to fall. */
  .line{
    margin:2.1rem auto 0;
    /* rem, not ch — the ch unit measures the "0" glyph and ignores letter-spacing, so a
       ch-based measure collapses far narrower than expected. 34rem at .18em reads as a block. */
    max-width:min(90vw,34rem);
    font-size:clamp(.85rem,2.4vw,1.02rem);font-weight:400;
    letter-spacing:.18em;text-indent:.18em;text-transform:uppercase;
    line-height:1.95;text-wrap:balance;
    color:var(--ivory-dim);
    opacity:0;animation:fadein 1.8s ease 1.2s forwards;
  }

  /* ---- register / login ---- */
  .actions{
    margin-top:2.7rem;display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;
    opacity:0;animation:fadein 1.8s ease 1.7s forwards;
  }
  .act{
    min-width:11rem;background:var(--panel);color:var(--ivory);
    border:1px solid rgba(216,178,76,.45);border-radius:2px;
    font-family:"Jost",sans-serif;font-weight:400;font-size:.7rem;
    letter-spacing:.26em;text-transform:uppercase;padding:.95rem 1.7rem;
    text-decoration:none;cursor:pointer;line-height:1;
    transition:background .35s ease,color .35s ease,border-color .35s ease;
  }
  .act:hover,.act:focus-visible{background:var(--gold);color:var(--ink);border-color:var(--gold);outline:none}
  .act[aria-expanded="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold)}

  /* The field stays in the DOM so it can animate open and so a keyboard user meets it in
     reading order, rather than having it appear from nowhere on click. */
  .signin{max-height:0;overflow:hidden;opacity:0;
    transition:max-height .45s ease,opacity .35s ease,margin-top .45s ease}
  .signin.open{max-height:14rem;opacity:1;margin-top:1.4rem}
  .signin form{display:inline-flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
  .signin input{
    background:var(--panel);border:1px solid rgba(216,178,76,.35);border-radius:2px;
    color:var(--ivory);font-family:"Jost",sans-serif;font-weight:300;
    font-size:.8rem;letter-spacing:.06em;padding:.85rem 1rem;width:min(72vw,17rem);
    outline:none;transition:border-color .35s ease;
  }
  .signin input::placeholder{color:var(--ivory-faint);letter-spacing:.14em}
  .signin input:focus{border-color:rgba(216,178,76,.8)}
  .signin .go{
    background:var(--panel);color:var(--gold);border:1px solid rgba(216,178,76,.45);border-radius:2px;
    font-family:"Jost",sans-serif;font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;
    padding:.85rem 1.3rem;cursor:pointer;transition:background .35s ease,color .35s ease;
  }
  .signin .go:hover,.signin .go:focus-visible{background:var(--gold);color:var(--ink);outline:none}
  .signin .msg{margin:.9rem auto 0;font-size:.78rem;line-height:1.6;color:var(--gold-bright);max-width:26rem}

  .foot{
    position:fixed;bottom:2rem;left:0;right:0;
    font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;
    color:var(--ivory-faint);
    opacity:0;animation:fadein 1.8s ease 1.8s forwards;
  }

  @keyframes fadein{to{opacity:1}}
  @keyframes risein{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

  @media (prefers-reduced-motion: reduce){
    .rule,.brand,.line,.foot{animation:none;opacity:1}
    .rule::after{animation:none;opacity:0}
  }
</style>

  <script>
  // ---- background rotator: pick one clip at random; graded via CSS filter ----
  (function(){
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    // grade = CSS filter applied to the video; tweak per clip if one misbehaves
    var G = 'saturate(1.35) contrast(1.07) brightness(0.7)';
    // Clips are pre-processed: slowed to 0.4x with motion interpolation baked in,
    // self-hosted in /media. Play at normal rate — slowness is in the file.
    var CLIPS = [
      {src:'media/az01-bali-temple.mp4',      grade:G},
      {src:'media/az02-overwater-villas.mp4', grade:G},
      {src:'media/az03-murano.mp4',           grade:G},
      {src:'media/az04-hallstatt.mp4',        grade:G},
      {src:'media/az05-sunrise-beach.mp4',    grade:'saturate(1.3) contrast(1.06) brightness(0.66) hue-rotate(-6deg)'},
      {src:'media/az06-lantern-street.mp4',   grade:'saturate(1.25) contrast(1.08) brightness(0.62)'},
      {src:'media/az07-machu-picchu.mp4',     grade:G},
      {src:'media/az08-weilburg-gardens.mp4', grade:G}
    ];
    var bg = document.querySelector('.bg');
    // Clips no longer loop individually: each plays once, fades to ink, and the
    // NEXT clip fades in — an endless chain through the whole collection.
    // Order is shuffled fresh on every page load (Fisher–Yates).
    var order = CLIPS.slice();
    for (var s = order.length - 1; s > 0; s--) {
      var j = Math.floor(Math.random() * (s + 1));
      var t = order[s]; order[s] = order[j]; order[j] = t;
    }

    var FADE_MS = 1700;    // matches the CSS opacity transition
    var HOLD_MS = 450;     // beat of pure ink between clips
    var idx = 0, fails = 0;

    function playNext(){
      if (fails >= order.length) return;         // every clip failed: quiet ink remains
      var c = order[idx % order.length]; idx++;
      var v = document.createElement('video');
      v.muted = true; v.autoplay = true;         // no loop: 'ended' hands off to the next
      v.setAttribute('playsinline','');
      v.style.filter = c.grade;
      v.src = c.src;
      var handed = false;
      function handoff(){
        if (handed) return; handed = true;
        v.classList.remove('on');                // fade to ink
        setTimeout(function(){
          v.remove();
          playNext();                            // next clip fades in after a beat
        }, FADE_MS + HOLD_MS);
      }
      v.addEventListener('error', function(){
        fails++; if (handed) return; handed = true;
        v.remove(); playNext();
      });
      v.addEventListener('canplay', function(){
        fails = 0;
        v.classList.add('on');
      });
      // begin the fade so it completes right as the clip ends
      v.addEventListener('timeupdate', function(){
        if (v.duration && (v.duration - v.currentTime) * 1000 <= FADE_MS) handoff();
      });
      v.addEventListener('ended', handoff);      // backstop
      bg.appendChild(v);
      var p = v.play(); if (p && p.catch) p.catch(function(){});
    }
    playNext();
  })();

  </script>

  <script>
  (function(){
    var btn = document.getElementById('loginBtn');
    var box = document.getElementById('signin');
    var msg = document.getElementById('signinMsg');
    if (!btn || !box) return;

    btn.addEventListener('click', function(){
      var open = box.classList.toggle('open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (open) setTimeout(function(){ document.getElementById('signinEmail').focus(); }, 320);
    });

    /* NO OTP WORKER YET. Say so rather than implying a code is on its way — a sign-in form that
       silently does nothing is worse than one that admits it is not open. Replace this handler
       with the POST to the Worker when it exists. */
    document.getElementById('signinForm').addEventListener('submit', function(e){
      e.preventDefault();
      var email = document.getElementById('signinEmail').value.trim();
      if (!email) return;
      // No backend: do not claim the address was stored, because it was not.
      msg.textContent = 'Sign-in is not open yet, and this form is not connected \u2014 nothing was sent.';
      e.target.querySelector('.go').disabled = true;
    });
  })();
  </script>
